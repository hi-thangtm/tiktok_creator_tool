name: Build Ubuntu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Ubuntu x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show runner information
        run: |
          python --version
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Import check
        run: |
          python -c "import PySide6.QtCore, PySide6.QtGui, PySide6.QtWidgets; import playwright; import sqlite3; import openpyxl; import PyInstaller; print('IMPORT_CHECK_OK')"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Build Ubuntu app
        run: |
          chmod +x build/build_linux.sh
          ./build/build_linux.sh

      - name: Verify Ubuntu output
        run: |
          OUTPUT_DIR="dist/linux/TikTokCreatorTool"
          EXE="$OUTPUT_DIR/TikTokCreatorTool"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Ubuntu output directory was not created: $OUTPUT_DIR"
            exit 1
          fi

          if [ ! -f "$EXE" ]; then
            echo "Ubuntu executable was not created: $EXE"
            exit 1
          fi

          if [ ! -x "$EXE" ]; then
            echo "Ubuntu executable is not executable: $EXE"
            exit 1
          fi

          file "$EXE"
          ls -lah "$OUTPUT_DIR"

      - name: Package Ubuntu app
        run: |
          tar \
            -C dist/linux \
            -czf TikTokCreatorTool-Ubuntu-x64.tar.gz \
            TikTokCreatorTool

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCreatorTool-Ubuntu-x64
          path: TikTokCreatorTool-Ubuntu-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
