name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show runner information
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Import check
        shell: pwsh
        run: |
          python -c "import PySide6.QtCore, PySide6.QtGui, PySide6.QtWidgets; import playwright; import sqlite3; import openpyxl; import PyInstaller; print('IMPORT_CHECK_OK')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests

      - name: Build Windows app
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build/build_windows.ps1

      - name: Verify Windows output
        shell: pwsh
        run: |
          $outputDir = "dist/windows/TikTokCreatorTool"
          $exe = Join-Path $outputDir "TikTokCreatorTool.exe"

          if (-not (Test-Path $outputDir)) {
              throw "Windows output directory was not created: $outputDir"
          }

          if (-not (Test-Path $exe)) {
              throw "Windows EXE was not created: $exe"
          }

          Get-ChildItem -Path $outputDir -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCreatorTool-Windows-x64
          path: dist/windows/TikTokCreatorTool/
          if-no-files-found: error
          retention-days: 7
